name = "carousel-stats-dashboard"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Static dashboard (public/) served by the same Worker
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Pull HumanPost every 30 minutes (views only change ~once a day; post status changes more often)
[triggers]
crons = ["*/30 * * * *"]

# Let the Worker import schema.sql as text (tables are created automatically on first use)
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "carousel-stats"
database_id = "e56f1834-7013-46c1-bda9-a7ffedf5fc4d"   # Cloudflare > Storage & Databases > D1 > carousel-stats > Database ID

# Secrets (never in this file):
#   npx wrangler secret put HUMANPOST_API_KEY   -> the key from humanpost.env
#   npx wrangler secret put INGEST_TOKEN        -> any long random string; the PC uses it to push tags
